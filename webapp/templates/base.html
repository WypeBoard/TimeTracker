<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}TimeTracker{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Phase 2 skeleton: CDN references for Tabler/Bootstrap/HTMX. Per
         features/standalone-web-app.md Requirements, these are acceptable
         during active development and must be vendored locally under
         webapp/static/ before the feature is considered complete
         (Implementation Plan, Phase 6). -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js" defer></script>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
</head>
<body>
<header class="navbar navbar-expand-md navbar-light d-print-none">
    <div class="container-xl">
        <a href="/today" class="navbar-brand navbar-brand-autodark">TimeTracker</a>
        <div class="navbar-nav flex-row">
            <div class="nav-item">
                <a href="/today" class="nav-link {% if active_nav == 'today' %}active{% endif %}">Today</a>
            </div>
            <div class="nav-item">
                <a href="/weekly" class="nav-link {% if active_nav == 'weekly' %}active{% endif %}">Weekly</a>
            </div>
            <div class="nav-item">
                <a href="/settings" class="nav-link {% if active_nav == 'settings' %}active{% endif %}">Settings</a>
            </div>
        </div>
        <span id="backend-status" class="badge bg-secondary-lt ms-auto">Checking backend...</span>
    </div>
</header>
<div class="page-wrapper">
    <div class="container-xl">
        {% block content %}{% endblock %}
    </div>
</div>

<script>
    // On-load /health check, per features/standalone-web-app.md Requirements.
    fetch("/health")
        .then(function (response) {
            if (!response.ok) {
                throw new Error("non-200");
            }
            return response.json();
        })
        .then(function (data) {
            var el = document.getElementById("backend-status");
            if (data.status === "ok") {
                el.textContent = "Backend: up";
                el.className = "badge bg-success-lt ms-auto";
            } else {
                el.textContent = "Backend: degraded";
                el.className = "badge bg-warning-lt ms-auto";
            }
        })
        .catch(function () {
            var el = document.getElementById("backend-status");
            el.textContent = "Backend: down";
            el.className = "badge bg-danger-lt ms-auto";
        });
</script>
</body>
</html>
